<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multicreate</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      background-color: #87CEEB;
    }

    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    #ui.hidden {
      display: none;
    }

    #ui button {
      margin: 5px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #multiplayerMenu {
      position: absolute;
      top: 100px;
      left: 10px;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: none;
    }

    #multiplayerMenu input {
      margin: 5px;
      padding: 5px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <h3>Game Controls</h3>
    <p>Middle click to cycle through blocks. Left click to remove a block. Right click to place a block. Use arrow keys to move the player.</p>
    <button id="resetButton">Reset World</button>
    <button id="resetPlayerButton">Reset Player</button>
    <button id="saveButton">Save World as TXT</button> <!-- Save button -->
  </div>
  
  <div id="multiplayerMenu">
    <h3>Multiplayer Menu</h3>
    <button id="startMultiworld">Start Multiworld</button>
    <p>Generated Code: <span id="multiworldCode"></span></p>
    <h4>Join Multiworld</h4>
    <input type="text" id="joinCode" placeholder="Enter code" />
    <button id="joinMultiworld">Join</button>
    <button id="closeMultiplayerMenu">Close</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  
  <input type="file" id="importFile" style="display: none;" accept=".zip" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const blockSize = 50;
    const world = [];
    const blockTypes = [
      { name: "Grass", color: "#228B22" },
      { name: "Dirt", color: "#8B4513" },
      { name: "Stone", color: "#808080" },
      { name: "Sand", color: "#FFD700" },
      { name: "Wood", color: "#A0522D" },
      { name: "Water", color: "#1E90FF" },
      { name: "Lava", color: "#FF4500" },
      { name: "Brick", color: "#B22222" },
      { name: "Coal", color: "#2F4F4F" },
      { name: "Gold", color: "#FFD700" },
      { name: "Iron", color: "#D4AF37" },
      { name: "Diamond", color: "#00CED1" },
      { name: "Emerald", color: "#50C878" },
      { name: "Obsidian", color: "#2B1B17" },
      { name: "Snow", color: "#FFFFFF" },
      { name: "Clay", color: "#B0E0E6" },
      { name: "Mossy Stone", color: "#556B2F" },
      { name: "Netherite", color: "#3C3C3C" },
      { name: "Quartz", color: "#F5F5F5" }
    ];
    let currentBlockType = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      width: blockSize,
      height: blockSize,
      color: "#FFDF00",
      speed: 5,
      gameMode: "Survival" // Default game mode
    };

    const ui = document.getElementById("ui");
    const multiplayerMenu = document.getElementById("multiplayerMenu");
    const importFileInput = document.getElementById("importFile");

    let playerVisible = true;

    // Multiplayer features
    let multiworldCode = '';
    let multiworldPlayers = [];

    function generateWorld() {
      world.length = 0;
      for (let x = 0; x < canvas.width / blockSize; x++) {
        for (let y = 0; y < canvas.height / blockSize; y++) {
          if (y > canvas.height / blockSize - 3) {
            world.push({ x: x * blockSize, y: y * blockSize, color: "#8B4513" });
          } else if (y === canvas.height / blockSize - 3) {
            world.push({ x: x * blockSize, y: y * blockSize, color: "#228B22" });
          }
        }
      }
    }

    function drawWorld() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      world.forEach(block => {
        ctx.fillStyle = block.color;
        ctx.fillRect(block.x, block.y, blockSize, blockSize);
        ctx.strokeStyle = "#000";
        ctx.strokeRect(block.x, block.y, blockSize, blockSize);
      });

      if (playerVisible) drawPlayer();
    }

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function handleMouseClick(event) {
      const rect = canvas.getBoundingClientRect();
      const mouseX = event.clientX - rect.left;
      const mouseY = event.clientY - rect.top;

      if (event.button === 0) { // Left click to remove block
        for (let i = 0; i < world.length; i++) {
          if (
            mouseX >= world[i].x &&
            mouseX < world[i].x + blockSize &&
            mouseY >= world[i].y &&
            mouseY < world[i].y + blockSize
          ) {
            world.splice(i, 1);
            break;
          }
        }
      } else if (event.button === 2) { // Right click to place block
        const gridX = Math.floor(mouseX / blockSize) * blockSize;
        const gridY = Math.floor(mouseY / blockSize) * blockSize;

        // Check if block already exists
        if (!world.some(block => block.x === gridX && block.y === gridY)) {
          world.push({ x: gridX, y: gridY, color: blockTypes[currentBlockType].color });
        }
      }

      drawWorld();
    }

    function handleMiddleClick(event) {
      if (event.button === 1) { // Middle click to cycle blocks
        event.preventDefault();
        currentBlockType = (currentBlockType + 1) % blockTypes.length;
        console.log(`Current block: ${blockTypes[currentBlockType].name}`);
      }
    }

    function handleKeyPress(event) {
      switch (event.key) {
        case "ArrowUp":
          player.y = Math.max(0, player.y - player.speed);
          break;
        case "ArrowDown":
          player.y = Math.min(canvas.height - player.height, player.y + player.speed);
          break;
        case "ArrowLeft":
          player.x = Math.max(0, player.x - player.speed);
          break;
        case "ArrowRight":
          player.x = Math.min(canvas.width - player.width, player.x + player.speed);
          break;
        case "f":
          ui.classList.toggle("hidden");
          break;
        case "g":
          playerVisible = !playerVisible; // Toggle player's visibility
          break;
        case "v":
          multiplayerMenu.style.display = "block"; // Show multiplayer menu
          break;
        case "z":
          saveWorldAsTxt(); // Save world as txt
          break;
        case "b":
          importFileInput.click(); // Open file dialog for importing saved world
          break;
      }
      drawWorld();
    }

    function resetWorld() {
      generateWorld();
      drawWorld();
    }

    function resetPlayer() {
      player.x = canvas.width / 2 - player.width / 2;
      player.y = canvas.height / 2 - player.height / 2;
      drawWorld();
    }

    function saveWorldAsTxt() {
      const worldData = JSON.stringify(world);
      const gameMode = player.gameMode; // Save the current game mode

      // Create a text file containing the block data and game mode
      let txtContent = `Game Mode: ${gameMode}\n\nBlocks:\n`;
      world.forEach(block => {
        txtContent += `Position: (${block.x}, ${block.y}), Block: ${block.color}\n`;
      });

      // Create a blob from the content and generate a downloadable link
      const blob = new Blob([txtContent], { type: 'text/plain' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "world_data.txt";
      link.click();
    }

    document.getElementById("startMultiworld").addEventListener("click", function() {
      multiworldCode = generateCode();
      document.getElementById("multiworldCode").innerText = multiworldCode;
    });

    document.getElementById("joinMultiworld").addEventListener("click", function() {
      const joinCode = document.getElementById("joinCode").value;
      if (joinCode === multiworldCode) {
        alert("Joined successfully!");
        // Add additional logic for joining multiplayer world
      } else {
        alert("Invalid code. Please try again.");
      }
    });

    document.getElementById("resetButton").addEventListener("click", resetWorld);
    document.getElementById("resetPlayerButton").addEventListener("click", resetPlayer);
    document.getElementById("closeMultiplayerMenu").addEventListener("click", function() {
      multiplayerMenu.style.display = "none";
    });

    canvas.addEventListener("mousedown", handleMouseClick);
    canvas.addEventListener("mousedown", handleMiddleClick);
    canvas.addEventListener("contextmenu", event => event.preventDefault());
    document.addEventListener("keydown", handleKeyPress);

    generateWorld();
    drawWorld();

    function generateCode() {
      const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let code = "";
      for (let i = 0; i < 6; i++) {
        code += characters.charAt(Math.floor(Math.random() * characters.length));
      }
      return code;
    }

    // Handle file import
    importFileInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const zip = new JSZip();
          zip.loadAsync(e.target.result).then(function(zip) {
            zip.forEach(function(relativePath, file) {
              file.async("text").then(function(content) {
                const worldData = JSON.parse(content);
                // Process the loaded world data here
                world.length = 0;
                world.push(...worldData.blocks);
                drawWorld();
              });
            });
          });
        };
        reader.readAsArrayBuffer(file);
      }
    });
  </script>
</body>
</html>
