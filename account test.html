<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multicreate Account System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .form-container, .dashboard {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        .form-container h2, .dashboard h2 {
            margin-bottom: 1rem;
        }
        .form-container input {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-container button, .dashboard button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 1rem;
        }
        .form-container button:hover, .dashboard button:hover {
            background-color: #45a049;
        }
        .world-button {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 0.5rem;
            background-color: #4CAF50;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .world-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Multicreate!</h1>
    </header>

    <div class="form-container" id="login-container">
        <h2>Log In</h2>
        <input type="text" id="login-username" placeholder="Username" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button onclick="handleLogin()">Log In</button>
        <p>Don't have an account? <a href="#" onclick="showSignUp()">Sign Up</a></p>
    </div>

    <div class="form-container" id="signup-container" style="display: none;">
        <h2>Sign Up</h2>
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
        <button onclick="handleSignUp()">Sign Up</button>
        <p>Already have an account? <a href="#" onclick="showLogin()">Log In</a></p>
    </div>

    <div class="dashboard" id="dashboard-container" style="display: none;">
        <h2>Dashboard</h2>
        <button onclick="createNewWorld()">Create New World</button>
        <div id="world-list">
            <!-- Created worlds will appear here -->
        </div>
    </div>

    <script>
        let worlds = [];

        function showSignUp() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('signup-container').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('signup-container').style.display = 'none';
            document.getElementById('login-container').style.display = 'block';
        }

        function showDashboard() {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('signup-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'block';
        }

        function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            if (username && password) {
                alert('Logged in successfully!');
                showDashboard();
            } else {
                alert('Please fill in all fields.');
            }
        }

        function handleSignUp() {
            const username = document.getElementById('signup-username').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (username && password && confirmPassword) {
                if (password === confirmPassword) {
                    alert('Account created successfully! Go to Log In.');
                    showLogin();
                } else {
                    alert('Passwords do not match.');
                }
            } else {
                alert('Please fill in all fields.');
            }
        }

        function createNewWorld() {
            const worldName = `World ${worlds.length + 1}`;
            worlds.push(worldName);

            const worldList = document.getElementById('world-list');
            const worldButton = document.createElement('button');
            worldButton.textContent = worldName;
            worldButton.className = 'world-button';
            worldButton.onclick = function () {
                openWorld(worldName);
            };

            worldList.appendChild(worldButton);
            alert(`${worldName} created and saved!`);
        }

        function openWorld(worldName) {
            alert(`Opening ${worldName}...`);
            // Replace the line below with actual code to load the multicreate world
            window.location.href = `multicreate_world.html?world=${encodeURIComponent(worldName)}`;
        }
    </script>
</body>
</html>
